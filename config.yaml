app:
  host: "127.0.0.1"
  port: 8000
  # Number of Uvicorn worker processes.
  # SQLite: MUST be 1 (database-wide write lock).
  # PostgreSQL: can be > 1, e.g. 4 (see the pool sizing notes in the postgresql section).
  workers: 1
  base_url: "http://localhost:8000"
  debug: false
  code_length: 7

# =============================================================================
# Database Configuration
# FastURL supports SQLite (single-worker) and PostgreSQL (multi-worker).
# Keep exactly one backend section active and comment out the other.
# The connection URL is built by the application from these fields.
# =============================================================================
database:
  echo: false

  # ---------------------------------------------------------------------------
  # SQLite (requires workers: 1)
  # ---------------------------------------------------------------------------
  sqlite:
    path: "instance/fasturl.db"

  # ---------------------------------------------------------------------------
  # PostgreSQL — the password is a secret: set DATABASE__POSTGRESQL__PASSWORD in .env
  # ---------------------------------------------------------------------------
  # postgresql:
  #   host: "127.0.0.1"
  #   port: 5432
  #   name: "fasturl_db"
  #   user: "fasturl_user"
  #   # Connection pool, per worker process (values below are for workers: 4).
  #   # - pool_size >= concurrent requests / workers, otherwise requests queue for a connection
  #   #   (e.g. 50 concurrent requests / 4 workers ~ 13 -> 15).
  #   # - workers * (pool_size + max_overflow) < PostgreSQL max_connections (default 100,
  #   #   97 usable by non-superusers), otherwise connections are rejected (HTTP 500).
  #   # - max_overflow: 0 keeps a fixed pool: no connection opened or closed under load.
  #   # See docs/benchmarks.md section 3.2.
  #   pool_size: 15
  #   max_overflow: 0
  #   pool_timeout: 30
  #   pool_recycle: 1800

log:
  # WARNING skips the per-request INFO logs; use INFO when debugging.
  level: "WARNING"
  console: true
  file: "logs/fasturl.log"
  rotation: "10 MB"
  retention: "7 days"
  compression: "zip"

inspector:
  timeout_seconds: 5.0
  max_redirects: 3
