# -----------------------------------------------------------------------------
# FastURL — Docker Compose
#
# The database backend is selected in config.yaml (keep either the "sqlite" or
# the "postgresql" section active):
#
#   SQLite:      docker compose up
#   PostgreSQL:  docker compose -f docker-compose.yml -f docker-compose.postgres.yml up
# -----------------------------------------------------------------------------
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./instance:/app/instance
      - ./logs:/app/logs
    environment:
      - APP__HOST=0.0.0.0
      - APP__DEBUG=false
    restart: unless-stopped
